name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Runs every day
  workflow_dispatch: # Allows manual run
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Language Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          base: "" # This hides the default header (stars, etc.)
          plugin_languages: yes
          plugin_languages_ignored: #hide simple languages
          plugin_languages_details: bytes-size, percentage
          filename: github-metrics.svg # The name of the file it creates
