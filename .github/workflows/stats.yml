name: Generate Profile Stats and Metrics

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-assets:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Generate the clean Stats Card you like (saved as dist/stats.svg)
      - name: Generate Beautiful Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Generate your tailored Language/Metrics Layout (saved as dist/github-metrics.svg)
      - name: Generate Custom Languages & Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }} # Uses your specific token for private repo language depth
          filename: github-metrics.svg
          output_action: none # Prevents the plugin from auto-committing, letting us handle it in dist/
          
          # Base configurations (We removed 'repositories' or 'header' if you want it strictly focused on languages, but kept your layout)
          base: header, activity, community, repositories
          config_order: header, languages, activity, community, repositories
          config_theme: github-dark
          
          # Your precise Language Plugin controls
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, blade, Dockerfile, Batchfile, Hack
          plugin_languages_limit: 10

      # Step 3: Deploy BOTH generated SVGs to your output branch
      - name: Push all assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
