name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Custom Stats Layout
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: github-metrics.svg
          
          # CONTROL THE ENTIRE DESIGN HERE:
          # header = your avatar/name, activity = recent activity, community = followers/stars, repositories = repo stats
          base: header, activity, community, repositories
          
          # Design Layout Tweaks
          config_order: header, languages, activity, community, repositories # Controls what appears first from top to bottom
          config_theme: github-dark # Options: github-dark, github-light, classic, terminal
          
          # Language Plugin Control
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, blade, Dockerfile, Batchfile, Hack
          plugin_languages_limit: 10
